[package]
name = "zg-market"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"
description = "zg 行情层：外部 K 线源 / TQ / 同花顺 / 报价 / 编排降级链 / 行业热度与情报（对齐 modules/zgapp + modules/market）"

[dependencies]
zg-core = { path = "../zg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["gzip"] }
regex = "1"
encoding_rs = "0.8"
sha1 = "0.10"
html-escape = "0.2"
ta-lib = "0.8"

[dev-dependencies]
tempfile = "3"
